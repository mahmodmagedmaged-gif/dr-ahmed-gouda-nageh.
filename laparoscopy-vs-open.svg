<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgEdu3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B2238"/>
      <stop offset="100%" stop-color="#07182B"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" rx="16" fill="url(#bgEdu3)"/>
  <rect x="8" y="8" width="584" height="344" rx="12" fill="none" stroke="#1A3A5E" stroke-width="1.5"/>

  <!-- Badge -->
  <rect x="25" y="25" width="220" height="32" rx="8" fill="#102E4C" stroke="#10BFC1" stroke-width="1"/>
  <text x="135" y="46" fill="#10BFC1" font-family="'Cairo', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">مقارنة المناظير والجراحة المفتوحة</text>

  <!-- Side by Side Comparison -->
  <!-- Left Side: Laparoscopy (Modern, Preferred) -->
  <g transform="translate(45, 80)">
    <rect width="240" height="240" rx="14" fill="#07182B" stroke="#10BFC1" stroke-width="1.5"/>
    <text x="120" y="32" fill="#10BFC1" font-family="'Cairo', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">جراحة المناظير (Laparoscopy)</text>
    
    <!-- Visual keyholes -->
    <g transform="translate(60, 50)">
      <circle cx="20" cy="20" r="6" fill="#10BFC1"/>
      <circle cx="60" cy="20" r="6" fill="#10BFC1"/>
      <circle cx="100" cy="20" r="6" fill="#10BFC1"/>
      <text x="60" y="48" fill="#E6B84F" font-family="'Cairo', sans-serif" font-size="10.5" text-anchor="middle">ثقوب دقيقة (0.5 - 1 سم)</text>
    </g>

    <!-- Bullets -->
    <text x="215" y="130" fill="#CBD5E1" font-family="'Cairo', sans-serif" font-size="11" text-anchor="end">✓ ألم وتورم أقل بكثير بعد العملية</text>
    <text x="215" y="158" fill="#CBD5E1" font-family="'Cairo', sans-serif" font-size="11" text-anchor="end">✓ تقليل النزيف وخطر العدوى</text>
    <text x="215" y="186" fill="#CBD5E1" font-family="'Cairo', sans-serif" font-size="11" text-anchor="end">✓ تعافي أسرع وعودة للنشاط في أيام</text>
    <text x="215" y="214" fill="#CBD5E1" font-family="'Cairo', sans-serif" font-size="11" text-anchor="end">✓ نتائج تجميلية ممتازة دون ندبات كبيرة</text>
  </g>

  <!-- Right Side: Open Surgery -->
  <g transform="translate(315, 80)">
    <rect width="240" height="240" rx="14" fill="#07182B" stroke="#254B77" stroke-width="1.5"/>
    <text x="120" y="32" fill="#94A3B8" font-family="'Cairo', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">الجراحة التقليدية المفتوحة</text>

    <!-- Visual Incision line -->
    <g transform="translate(60, 50)">
      <line x1="20" y1="20" x2="100" y2="20" stroke="#E27343" stroke-width="4" stroke-linecap="round"/>
      <line x1="35" y1="14" x2="35" y2="26" stroke="#94A3B8" stroke-width="1.5"/>
      <line x1="60" y1="14" x2="60" y2="26" stroke="#94A3B8" stroke-width="1.5"/>
      <line x1="85" y1="14" x2="85" y2="26" stroke="#94A3B8" stroke-width="1.5"/>
      <text x="60" y="48" fill="#E27343" font-family="'Cairo', sans-serif" font-size="10.5" text-anchor="middle">جرح جراحي طولي تقليدي</text>
    </g>

    <!-- Bullets -->
    <text x="215" y="130" fill="#94A3B8" font-family="'Cairo', sans-serif" font-size="11" text-anchor="end">• تستدعي البقاء فترة أطول بالمستشفى</text>
    <text x="215" y="158" fill="#94A3B8" font-family="'Cairo', sans-serif" font-size="11" text-anchor="end">• مدة تعافي أطول والتئام تدريجي</text>
    <text x="215" y="186" fill="#94A3B8" font-family="'Cairo', sans-serif" font-size="11" text-anchor="end">• ضرورية لبعض الحالات المعقدة</text>
    <text x="215" y="214" fill="#E6B84F" font-family="'Cairo', sans-serif" font-size="10.5" text-anchor="end">يحدد الطبيب النهج الأنسب لكل مريض</text>
  </g>
</svg>
