<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGal1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B2238"/>
      <stop offset="100%" stop-color="#07182B"/>
    </linearGradient>
  </defs>
  <rect width="500" height="350" rx="16" fill="url(#bgGal1)"/>
  <rect x="8" y="8" width="484" height="334" rx="12" fill="none" stroke="#10BFC1" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.4"/>

  <!-- Abdomen Contour Outline -->
  <path d="M160 80 C190 70 310 70 340 80 C380 120 380 230 340 270 C310 280 190 280 160 270 C120 230 120 120 160 80 Z" fill="#102E4C" stroke="#254B77" stroke-width="2"/>
  
  <!-- Umbilicus / Camera Port -->
  <circle cx="250" cy="180" r="10" fill="#07182B" stroke="#E6B84F" stroke-width="3"/>
  <line x1="250" y1="180" x2="390" y2="180" stroke="#E6B84F" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="400" y="184" fill="#E6B84F" font-family="'Cairo', sans-serif" font-size="11" font-weight="bold">منفذ كاميرا المنظار (10 مم)</text>

  <!-- Working Port 1 (Right upper) -->
  <circle cx="210" cy="130" r="7" fill="#07182B" stroke="#10BFC1" stroke-width="2.5"/>
  <line x1="210" y1="130" x2="90" y2="130" stroke="#10BFC1" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="80" y="134" fill="#10BFC1" font-family="'Cairo', sans-serif" font-size="11" font-weight="bold" text-anchor="end">منفذ الأدوات الدقيقة (5 مم)</text>

  <!-- Working Port 2 (Left upper) -->
  <circle cx="290" cy="130" r="7" fill="#07182B" stroke="#10BFC1" stroke-width="2.5"/>

  <!-- Working Port 3 (Assistant) -->
  <circle cx="180" cy="210" r="7" fill="#07182B" stroke="#10BFC1" stroke-width="2.5"/>

  <!-- Minimal Invasiveness Badge -->
  <rect x="25" y="25" width="180" height="28" rx="6" fill="#07182B" stroke="#10BFC1" stroke-width="1"/>
  <text x="115" y="44" fill="#10BFC1" font-family="'Cairo', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">منافذ جراحة المنظار الدقيقة</text>
  
  <text x="250" y="315" fill="#94A3B8" font-family="'Cairo', sans-serif" font-size="11" text-anchor="middle">ثقوب جراحية دقيقة لا تتعدى سنتيمترًا واحدًا تضمن أقصى معايير السلامة</text>
</svg>
