<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgEdu5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B2238"/>
      <stop offset="100%" stop-color="#07182B"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" rx="16" fill="url(#bgEdu5)"/>
  <rect x="8" y="8" width="584" height="344" rx="12" fill="none" stroke="#1A3A5E" stroke-width="1.5"/>

  <!-- Badge -->
  <rect x="25" y="25" width="210" height="32" rx="8" fill="#102E4C" stroke="#10BFC1" stroke-width="1"/>
  <text x="130" y="46" fill="#10BFC1" font-family="'Cairo', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">أركان الرعاية بعد العملية</text>

  <!-- 3 Main Pillars -->
  <!-- Pillar 1: Wound care -->
  <g transform="translate(45, 85)">
    <rect width="155" height="230" rx="12" fill="#07182B" stroke="#254B77" stroke-width="1.5"/>
    <circle cx="77" cy="45" r="24" fill="#102E4C" stroke="#10BFC1" stroke-width="2"/>
    <path d="M70 45 L75 50 L85 40" stroke="#10BFC1" stroke-width="2.5" fill="none"/>
    <text x="77" y="95" fill="#10BFC1" font-family="'Cairo', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">العناية بالجرح</text>
    <text x="77" y="125" fill="#CBD5E1" font-family="'Cairo', sans-serif" font-size="10.5" text-anchor="middle">الحفاظ على النظافة</text>
    <text x="77" y="145" fill="#CBD5E1" font-family="'Cairo', sans-serif" font-size="10.5" text-anchor="middle">والجفاف وتغيير</text>
    <text x="77" y="165" fill="#CBD5E1" font-family="'Cairo', sans-serif" font-size="10.5" text-anchor="middle">الضمادات الطبية</text>
    <text x="77" y="185" fill="#CBD5E1" font-family="'Cairo', sans-serif" font-size="10.5" text-anchor="middle">وفق الإرشادات</text>
  </g>

  <!-- Pillar 2: Nutrition & Hydration -->
  <g transform="translate(222, 85)">
    <rect width="155" height="230" rx="12" fill="#07182B" stroke="#10BFC1" stroke-width="1.5"/>
    <circle cx="77" cy="45" r="24" fill="#102E4C" stroke="#E6B84F" stroke-width="2"/>
    <path d="M77 35 V55 M67 45 H87" stroke="#E6B84F" stroke-width="2.5" stroke-linecap="round"/>
    <text x="77" y="95" fill="#E6B84F" font-family="'Cairo', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">التدرج الغذائي</text>
    <text x="77" y="125" fill="#CBD5E1" font-family="'Cairo', sans-serif" font-size="10.5" text-anchor="middle">السوائل ثم الأطعمة</text>
    <text x="77" y="145" fill="#CBD5E1" font-family="'Cairo', sans-serif" font-size="10.5" text-anchor="middle">المهروسة ثم اللينة</text>
    <text x="77" y="165" fill="#CBD5E1" font-family="'Cairo', sans-serif" font-size="10.5" text-anchor="middle">لتجنب أي إجهاد</text>
    <text x="77" y="185" fill="#CBD5E1" font-family="'Cairo', sans-serif" font-size="10.5" text-anchor="middle">للقناة الهضمية</text>
  </g>

  <!-- Pillar 3: Mobility & Alerts -->
  <g transform="translate(400, 85)">
    <rect width="155" height="230" rx="12" fill="#07182B" stroke="#254B77" stroke-width="1.5"/>
    <circle cx="77" cy="45" r="24" fill="#102E4C" stroke="#10BFC1" stroke-width="2"/>
    <path d="M77 34 A11 11 0 1 1 76.9 34" stroke="#10BFC1" stroke-width="2.5" fill="none"/>
    <text x="77" y="95" fill="#10BFC1" font-family="'Cairo', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">الحركة المبكرة</text>
    <text x="77" y="125" fill="#CBD5E1" font-family="'Cairo', sans-serif" font-size="10.5" text-anchor="middle">المشي الخفيف يحفز</text>
    <text x="77" y="145" fill="#CBD5E1" font-family="'Cairo', sans-serif" font-size="10.5" text-anchor="middle">الدورة الدموية ويمنع</text>
    <text x="77" y="165" fill="#CBD5E1" font-family="'Cairo', sans-serif" font-size="10.5" text-anchor="middle">التجلطات ويسرّع</text>
    <text x="77" y="185" fill="#CBD5E1" font-family="'Cairo', sans-serif" font-size="10.5" text-anchor="middle">عمل الأمعاء</text>
  </g>
</svg>
