<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGal2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B2238"/>
      <stop offset="100%" stop-color="#07182B"/>
    </linearGradient>
  </defs>
  <rect width="500" height="350" rx="16" fill="url(#bgGal2)"/>
  <rect x="8" y="8" width="484" height="334" rx="12" fill="none" stroke="#E6B84F" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.4"/>

  <!-- Gastric Anatomy & Calibrated Tube Line -->
  <!-- Fundus / Greater Curvature (Resected) -->
  <path d="M250 80 C320 80 370 120 370 190 C370 250 320 280 260 250 Z" fill="rgba(230, 184, 79, 0.15)" stroke="#E6B84F" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="330" y="180" fill="#E6B84F" font-family="'Cairo', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">قبة المعدة (Fundus)</text>
  <text x="330" y="200" fill="#CBD5E1" font-family="'Cairo', sans-serif" font-size="10" text-anchor="middle">مركز إفراز هرمون الجريلين (الجوع)</text>

  <!-- Calibrated Remaining Sleeve Tube -->
  <path d="M230 80 C230 140 220 220 250 260 L260 250 C260 190 250 130 250 80 Z" fill="#10BFC1" stroke="#2CE1E3" stroke-width="2.5"/>
  <text x="180" y="170" fill="#10BFC1" font-family="'Cairo', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">المعدة المكممة</text>
  <text x="180" y="190" fill="#CBD5E1" font-family="'Cairo', sans-serif" font-size="10" text-anchor="middle">سعة مقلصة بحجم الموزة</text>

  <!-- Preservation of Pylorus -->
  <text x="250" y="295" fill="#10BFC1" font-family="'Cairo', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">✓ الحفاظ على صمام البواب ومسار الامتصاص الطبيعي للأمعاء</text>
  <text x="250" y="320" fill="#94A3B8" font-family="'Cairo', sans-serif" font-size="10" text-anchor="middle">رسم تخطيطي تعليمي مبسط لتوضيح ماهية التدخل الجراحي</text>
</svg>
