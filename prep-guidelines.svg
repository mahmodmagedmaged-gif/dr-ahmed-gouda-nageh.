<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgEdu4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B2238"/>
      <stop offset="100%" stop-color="#07182B"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" rx="16" fill="url(#bgEdu4)"/>
  <rect x="8" y="8" width="584" height="344" rx="12" fill="none" stroke="#1A3A5E" stroke-width="1.5"/>

  <!-- Badge -->
  <rect x="25" y="25" width="200" height="32" rx="8" fill="#102E4C" stroke="#10BFC1" stroke-width="1"/>
  <text x="125" y="46" fill="#10BFC1" font-family="'Cairo', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">خطة التحضير قبل الجراحة</text>

  <!-- 4 Step Timeline -->
  <g transform="translate(40, 95)">
    <!-- Connecting Line -->
    <line x1="50" y1="40" x2="470" y2="40" stroke="#10BFC1" stroke-width="2.5" stroke-dasharray="5 5"/>

    <!-- Step 1 -->
    <g transform="translate(50, 40)">
      <circle cx="0" cy="0" r="22" fill="#07182B" stroke="#10BFC1" stroke-width="3"/>
      <text x="0" y="6" fill="#10BFC1" font-family="'Cairo', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">1</text>
      <text x="0" y="45" fill="#E6B84F" font-family="'Cairo', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">الفحوصات الشاملة</text>
      <text x="0" y="65" fill="#CBD5E1" font-family="'Cairo', sans-serif" font-size="10" text-anchor="middle">تحاليل الدم، السيولة،</text>
      <text x="0" y="80" fill="#CBD5E1" font-family="'Cairo', sans-serif" font-size="10" text-anchor="middle">ورسم القلب والأشعة</text>
    </g>

    <!-- Step 2 -->
    <g transform="translate(190, 40)">
      <circle cx="0" cy="0" r="22" fill="#07182B" stroke="#10BFC1" stroke-width="3"/>
      <text x="0" y="6" fill="#10BFC1" font-family="'Cairo', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">2</text>
      <text x="0" y="45" fill="#E6B84F" font-family="'Cairo', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">مراجعة الأدوية</text>
      <text x="0" y="65" fill="#CBD5E1" font-family="'Cairo', sans-serif" font-size="10" text-anchor="middle">إيقاف أو ضبط أدوية</text>
      <text x="0" y="80" fill="#CBD5E1" font-family="'Cairo', sans-serif" font-size="10" text-anchor="middle">السيولة والسكر والضغط</text>
    </g>

    <!-- Step 3 -->
    <g transform="translate(330, 40)">
      <circle cx="0" cy="0" r="22" fill="#07182B" stroke="#10BFC1" stroke-width="3"/>
      <text x="0" y="6" fill="#10BFC1" font-family="'Cairo', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">3</text>
      <text x="0" y="45" fill="#E6B84F" font-family="'Cairo', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">ساعات الصيام</text>
      <text x="0" y="65" fill="#CBD5E1" font-family="'Cairo', sans-serif" font-size="10" text-anchor="middle">الامتناع عن الطعام</text>
      <text x="0" y="80" fill="#CBD5E1" font-family="'Cairo', sans-serif" font-size="10" text-anchor="middle">والشراب (6-8 ساعات)</text>
    </g>

    <!-- Step 4 -->
    <g transform="translate(470, 40)">
      <circle cx="0" cy="0" r="22" fill="#07182B" stroke="#E6B84F" stroke-width="3"/>
      <text x="0" y="6" fill="#E6B84F" font-family="'Cairo', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">4</text>
      <text x="0" y="45" fill="#E6B84F" font-family="'Cairo', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">الحضور المبكر</text>
      <text x="0" y="65" fill="#CBD5E1" font-family="'Cairo', sans-serif" font-size="10" text-anchor="middle">استقبال الحالة وبدء</text>
      <text x="0" y="80" fill="#CBD5E1" font-family="'Cairo', sans-serif" font-size="10" text-anchor="middle">التحضير المباشر للجراحة</text>
    </g>
  </g>

  <!-- Bottom Tip -->
  <rect x="60" y="275" width="480" height="40" rx="8" fill="#07182B" stroke="#254B77" stroke-width="1"/>
  <text x="300" y="300" fill="#94A3B8" font-family="'Cairo', sans-serif" font-size="11" text-anchor="middle">الالتزام الصارم بتعليمات طبيب التخدير والجراح يضمن سلامة الإجراء وتفادي أي تأجيل.</text>
</svg>
